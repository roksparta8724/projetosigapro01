name: Neon migration validation

on:
  push:
    branches:
      - main
      - neon-first-migration-20261008
      - workbench-sigapro-polish-no-deploy-20261009
      - workbench/logo-preview-premium-no-deploy-20261016
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: SaaS page runtime audit
        run: npm run runtime:pages

      - name: Build
        run: npm run build

      # Complete suite is enforced by the four required quality-gate shards.
      - name: Neon and SEI regressions
        run: >
          npx vitest run
          src/test/municipalMultiDepartmentStaff20261118.test.ts
          src/test/municipalStaffLegacyAssignment20261119.test.tsx
          src/test/seiUnitMarkerActions20261117.test.tsx
          src/test/processMarkerLimit20261117.test.ts
          src/test/officialProcessCanonicalStatusAndList.test.ts
          src/test/municipalProcessRegistry.test.ts
          src/test/municipalAdminRegistryProduction20261119.test.ts

