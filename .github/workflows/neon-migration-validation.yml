name: Neon migration validation

on:
  push:
    branches:
      - neon-first-migration-20261008
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Smoke test public Neon TEMP Data API
        env:
          NEON_TEMP_DATA_API: https://ep-blue-cloud-b4hhgb4t.apirest.c-6.us-east-2.aws.neon.tech/sigapro_migration_stage_20260923/rest/v1
        run: |
          municipalities_status=$(curl -sS -o /tmp/municipalities.json -w "%{http_code}" "$NEON_TEMP_DATA_API/municipalities?select=id,name,status&limit=1")
          test "$municipalities_status" = "200"
          grep -q '"id"' /tmp/municipalities.json

          branding_status=$(curl -sS -o /tmp/branding.json -w "%{http_code}" "$NEON_TEMP_DATA_API/municipality_branding?select=municipality_id,logo_url&limit=1")
          echo "branding_status=$branding_status"
          test "$branding_status" = "200"


      - name: Disposable Neon TEMP Auth + RLS E2E
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[neon-e2e]')
        env:
          NEON_TEMP_AUTH_URL: https://ep-blue-cloud-b4hhgb4t.neonauth.c-6.us-east-2.aws.neon.tech/sigapro_migration_stage_20260923/auth
          NEON_TEMP_DATA_API: https://ep-blue-cloud-b4hhgb4t.apirest.c-6.us-east-2.aws.neon.tech/sigapro_migration_stage_20260923/rest/v1
          NEON_TEMP_TENANT_ID: 49dac0b6-6352-4744-9aab-9ff91c59d970
        run: node .github/scripts/neon-temp-e2e.mjs

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Keep npm lockfile synchronized on migration branch
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: sync package-lock for Neon SDK [skip ci]"
          git push
