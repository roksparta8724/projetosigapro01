name: Neon migration validation

on:
  push:
    branches:
      - neon-first-migration-20261008
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      - name: One-shot R2 signed-read probe
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[r2-read-probe]')
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch("https://sigapromunicipal.com.br/api/r2-sign-get", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              bucket: "sigapro-logos",
              objectKey: "platform/branding/header-logo.png",
              expiresIn: 300,
            }),
          });

          const payload = await response.json().catch(() => ({}));
          console.log("R2_SIGN_STATUS="+response.status);
          console.log("R2_SIGN_HAS_URL="+Boolean(payload?.signedUrl));
          if (!response.ok || !payload?.signedUrl) {
            throw new Error("R2 sign-get failed");
          }

          const file = await fetch(payload.signedUrl);
          console.log("R2_OBJECT_STATUS="+file.status);
          console.log("R2_OBJECT_CONTENT_TYPE="+(file.headers.get("content-type") || ""));
          if (!file.ok) throw new Error("R2 object read failed");
          console.log("R2_READ_RESULT=PASS");
          NODE

      - name: Keep npm lockfile synchronized on migration branch
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: sync package-lock for Neon SDK [skip ci]"
          git push
