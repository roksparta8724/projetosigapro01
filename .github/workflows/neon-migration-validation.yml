name: Neon migration validation

on:
  push:
    branches:
      - main
      - neon-first-migration-20261008
      - workbench-sigapro-polish-no-deploy-20261009
      - workbench/logo-preview-premium-no-deploy-20261016
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: SaaS page runtime audit
        run: npm run runtime:pages

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

