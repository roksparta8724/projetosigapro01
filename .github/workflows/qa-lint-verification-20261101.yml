name: SIGAPRO QA lint verification

on:
  push:
    branches:
      - fix/qa-triagem-analise-pagamento-20261101

permissions:
  contents: read

jobs:
  full-eslint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run lint
