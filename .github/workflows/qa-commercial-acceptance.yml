name: SIGAPRO Commercial Acceptance QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go-no-go:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test scripts/qa-commercial-acceptance.test.mjs
      - run: node scripts/qa-commercial-acceptance.mjs --report
      - name: Reject pending, stale or unverified evidence
        run: node scripts/qa-commercial-acceptance.mjs --enforce
