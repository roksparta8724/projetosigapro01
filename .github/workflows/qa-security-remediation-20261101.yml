name: SIGAPRO QA security remediation (isolated branch)

on:
  push:
    branches:
      - fix/qa-triagem-analise-pagamento-20261101
    paths:
      - .github/workflows/qa-security-remediation-20261101.yml

permissions:
  contents: write

jobs:
  safe-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Test patched minimatch in development tools without forcing npm audit
        shell: bash
        run: |
          npm pkg set "overrides.minimatch=11.0.1"
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-fund
          npm audit fix --package-lock-only --ignore-scripts --legacy-peer-deps --no-fund || true
      - name: Check both dependency trees (zero known advisories required)
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > "$RUNNER_TEMP/runtime.json" || true
          npm audit --json > "$RUNNER_TEMP/full.json" || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          let total=0;
          for(const [label,name] of [['runtime','runtime.json'],['full','full.json']]){
            const report=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/'+name,'utf8'));
            if(report.error || !report.metadata?.vulnerabilities) throw Error('No audit report for '+label);
            const issues=Object.entries(report.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,fixAvailable:v.fixAvailable,via:v.via}));
            console.log('AFTER_FIX_'+label.toUpperCase()+' '+JSON.stringify(report.metadata.vulnerabilities));
            console.log('AFTER_FIX_'+label.toUpperCase()+'_ISSUES '+JSON.stringify(issues));
            total+=Number(report.metadata.vulnerabilities.total||0);
          }
          if(total) throw Error('Unpatched advisories after compatible npm remediation: '+total);
          NODE
      - name: Verify updated lockfile and project
        shell: bash
        run: |
          npm ci --ignore-scripts --legacy-peer-deps
          npm run typecheck
          npm test
          npm run build
          npm run lint
      - name: Commit verified safe lockfile remediation in isolated branch
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json package.json; then
            echo 'No lockfile changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix(deps): remediate npm advisories with verified compatible lockfile'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:fix/qa-triagem-analise-pagamento-20261101
