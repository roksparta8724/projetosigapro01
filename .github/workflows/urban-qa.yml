name: SIGAPRO Urbanismo QA

on:
  push:
    branches:
      - qa/sigapro-ia-logo-integrado-20261023
  workflow_dispatch:

concurrency:
  group: sigapro-urban-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and regression tests
        run: npm test
      - name: Production build check (no deployment)
        run: npm run build
