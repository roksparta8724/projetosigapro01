name: SIGAPRO collection isolated code checks

on:
  push:
    branches:
      - review/sigapro-integral-local-20261021
    paths:
      - .github/workflows/collection-qa-validation.yml
      - scripts/dev-qa.mjs
      - package.json
      - vite.config.ts
      - src/pages/saas/CollectionSettingsPage.tsx
      - src/components/platform/MunicipalBankDetailsSettings.tsx
      - src/components/platform/MunicipalPaymentSettings.tsx
      - src/components/platform/MunicipalCollectionSettings.tsx
      - src/styles/surface-polarity.css
      - src/integrations/backend/databaseClient.ts
      - src/lib/collectionDiagnostics.ts
      - src/test/collectionDiagnostics.test.ts
      - src/test/collectionNeonAuthAlignment.test.ts
      - src/test/municipalBankingFlow.test.ts
      - server/municipal-storage.ts
      - src/test/**
      - src/components/platform/PortalFrame.tsx
      - src/components/platform/UrbanAnalysisChecklistPanel.tsx
      - api/collection-configuration.ts
      - neon/migrations/20261021_municipal_collection_*.sql
      - neon/migrations/20261021_dam_original_and_provider_persistence.sql
      - src/lib/municipalCollectionBridge.ts
      - src/components/platform/GovbrArGuideBridge.tsx
      - src/pages/saas/ProcessDetailPage.tsx
      - src/pages/saas/ProtocolDeskPage.tsx
      - src/components/GuiaRecolhimentoOficial.tsx
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collection:
    name: TypeScript, local collection tests and compile only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout review code
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Check safe QA launcher without opening ports
        run: npm run dev:qa:check
      - name: TypeScript
        run: npm run typecheck
      - name: Collection and GOVBR regression tests
        run: >-
          npx vitest run
          src/test/collectionDiagnostics.test.ts
          src/test/collectionNeonAuthAlignment.test.ts
          src/test/municipalCollectionConfiguration.test.ts
          src/test/govbrArGuideBridge.test.ts
          src/test/damProviderPersistence.test.ts
          src/lib/guideOriginal.test.ts
          src/test/municipalBankingFlow.test.ts
      - name: Entire application regression suite (no deployment)
        run: npm test -- --reporter=dot
      - name: Production-format bundle (no deployment)
        if: always()
        run: npm run build
