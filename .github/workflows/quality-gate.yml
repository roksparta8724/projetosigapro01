name: SIGAPRO Quality Gate

on:
  push:
    branches:
      - main
      - workbench/**
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Enforce zero known npm vulnerabilities in both runtime and complete dependency tree.
      - name: Dependency security inventory
        shell: bash
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit-runtime.json" || true
          npm audit --json > "$RUNNER_TEMP/audit-all.json" || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let unpatched = 0;
          for (const [label, filename] of [
            ['RUNTIME', 'audit-runtime.json'],
            ['ALL', 'audit-all.json'],
          ]) {
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/' + filename, 'utf8'));
            if (report.error || !report.metadata?.vulnerabilities) {
              throw new Error('npm audit did not return a verifiable result for '+label);
            }
            const severities = report.metadata.vulnerabilities;
            const affected = Object.entries(report.vulnerabilities || {})
              .map(([name, item]) => ({ name, severity: item.severity, isDirect: item.isDirect, fixAvailable: item.fixAvailable }))
              .sort((a,b) => ({ critical: 0, high: 1, moderate: 2, low: 3 }[a.severity] ?? 4) -
                             ({ critical: 0, high: 1, moderate: 2, low: 3 }[b.severity] ?? 4));
            console.log('AUDIT_' + label + '_COUNTS ' + JSON.stringify(severities));
            console.log('AUDIT_' + label + '_PACKAGES ' + JSON.stringify(affected));
            unpatched += Number(severities.total || 0);
          }
          if (unpatched !== 0) {
            throw new Error('SIGAPRO release blocked: npm audit found '+unpatched+' known advisories (runtime + all).');
          }
          console.log('SIGAPRO_SECURITY_GATE_PASS: zero known npm vulnerabilities in both reports');
          NODE

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test -- --reporter=verbose

      - name: Private AI gateway tests without GPU
        run: node --test infra/private-ai/gateway/gateway.test.mjs

      - name: Production build
        run: npm run build
