name: SIGAPRO Quality Gate

on:
  push:
    branches:
      - main
      - workbench/**
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test -- --reporter=verbose

      - name: Production build
        run: npm run build

      # Verify the exact municipal DAM markup with a REAL headless browser,
      # using only a synthetic, non-payable QA guide and bundled crest.
      - name: Print synthetic municipal A4 boleto in Chrome
        if: github.event_name == 'pull_request' && github.head_ref == 'qa/sigapro-ia-logo-integrado-20261023'
        env:
          SIGAPRO_QA_PDF_OUTPUT_DIR: /tmp/sigapro-boleto-qa-browser
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run src/test/qaBoletoBrowserPdfSmoke.test.tsx --reporter=dot
          pdf="$SIGAPRO_QA_PDF_OUTPUT_DIR/boleto-homologacao.pdf"
          html="$SIGAPRO_QA_PDF_OUTPUT_DIR/boleto-homologacao.html"
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "QA PDF FAIL: Chrome missing"; exit 1; }
          timeout 60 "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --no-first-run \
            --no-default-browser-check --no-pdf-header-footer --print-to-pdf="$pdf" "file://$html" \
            > /tmp/sigapro-boleto-chrome.log 2>&1 || { tail -n 35 /tmp/sigapro-boleto-chrome.log; exit 1; }
          test -s "$pdf"
          test "$(head -c 5 "$pdf")" = '%PDF-'
          if command -v pdfinfo >/dev/null 2>&1; then
            pdfinfo "$pdf" | grep -E '^(Pages:|Page size:)'
            test "$(pdfinfo "$pdf" | awk '/^Pages:/ { print $2 }')" = 1
            pdfinfo "$pdf" | grep -Eq 'Page size:[[:space:]]+595([.]| ).*841([.]| )'
          fi
          echo "PASS: Chrome created an original-shaped, single-page A4 synthetic QA DAM PDF"

      # Test the exact HTML-to-canvas + jsPDF code used by permanent Neon/R2
      # archival, not only Chrome's unrelated Print to PDF implementation.
      - name: Render actual SIGAPRO original PDF in Chrome
        if: github.event_name == 'pull_request' && github.head_ref == 'qa/sigapro-ia-logo-integrado-20261023'
        run: node scripts/qa-dam-original-browser-render.mjs

      - name: Keep isolated synthetic PDF for visual QA
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'qa/sigapro-ia-logo-integrado-20261023'
        uses: actions/upload-artifact@v4
        with:
          name: sigapro-dam-a4-qa-${{ github.run_id }}
          path: /tmp/sigapro-boleto-qa-browser/boleto-homologacao.pdf
          retention-days: 3
          if-no-files-found: ignore

      # Live, credential-free QA security checks. Run only for this isolated
      # PR: never reach the QA function from main or unrelated deployments.
      # The script sends only unauthenticated OPTIONS/negative requests.
      - name: Live isolated QA storage origin and access smoke
        if: github.event_name == 'pull_request' && github.head_ref == 'qa/sigapro-ia-logo-integrado-20261023'
        run: node scripts/qa-neon-live-smoke.mjs
