    <script>
      (function () {
        var path = window.location.pathname || "/";
        var publicPaths = ["/", "/inicio", "/apresentacao", "/planos-publicos"];
        var authPaths = ["/acesso", "/criar-conta", "/recuperar-senha"];
        var initialBackground = "#f3faf7";

        if (publicPaths.indexOf(path) >= 0 || path.indexOf("/cliente/") === 0) {
          initialBackground = "#f5f7fb";
        } else if (authPaths.indexOf(path) >= 0) {
          initialBackground = "#06111d";
        } else {
          try {
            var rawTheme = window.localStorage.getItem("sigapro-layout-theme");
            var theme = rawTheme ? JSON.parse(rawTheme) : null;
            if (theme && typeof theme.background === "string" && theme.background.trim()) {
              initialBackground = theme.background.trim();
            }
          } catch (error) {
            initialBackground = "#f3faf7";
          }
        }

        document.documentElement.style.setProperty("--sig-initial-bg", initialBackground);
        document.documentElement.setAttribute("data-sigapro-booting", "true");
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: var(--sig-initial-bg, #f3faf7);
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

  </body>
