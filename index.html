    <script>
      (function () {
        var lastDispatchAt = 0;

        function isRefreshShortcut(event) {
          var key = String(event.key || "").toLowerCase();
          var code = String(event.code || "").toLowerCase();
          var keyCode = Number(event.keyCode || event.which || 0);

          var isF5 =
            key === "f5" ||
            code === "f5" ||
            keyCode === 116;

          var isReloadShortcut =
            (event.ctrlKey || event.metaKey) &&
            key === "r" &&
            !event.shiftKey;

          return isF5 || isReloadShortcut;
        }

        function blockDocumentReload(event) {
          if (!isRefreshShortcut(event)) return true;

          event.preventDefault();
          event.stopPropagation();
          if (typeof event.stopImmediatePropagation === "function") {
            event.stopImmediatePropagation();
          }
          try {
            event.returnValue = false;
            event.cancelBubble = true;
          } catch (_) {}

          var now = Date.now();
          if (now - lastDispatchAt > 180) {
            lastDispatchAt = now;
            window.dispatchEvent(
              new CustomEvent("sigapro-soft-refresh", {
                detail: { source: "keyboard", at: now }
              })
            );
          }

          return false;
        }

        // Captura em dois níveis e nas três fases de teclado para evitar que
        // Chrome/Edge/atalhos legados executem o reload do documento.
        ["keydown", "keypress", "keyup"].forEach(function (type) {
          window.addEventListener(type, blockDocumentReload, true);
          document.addEventListener(type, blockDocumentReload, true);
        });

        window.__sigaproBlockDocumentReload = blockDocumentReload;
      })();
    </script>

    <script>
      (function () {
        var path = window.location.pathname || "/";
        var publicPaths = ["/", "/inicio", "/apresentacao", "/planos-publicos"];
        var authPaths = ["/acesso", "/criar-conta", "/recuperar-senha"];
        var isFullDocumentRoute =
          /\/processos\/[^/]+\/documentos\/[^/]+\/(visualizar|analisar)$/.test(path);
        var initialBackground = isFullDocumentRoute ? "#dfe5ec" : "#f5f7fb";

        if (isFullDocumentRoute) {
          initialBackground = "#dfe5ec";
        } else if (publicPaths.indexOf(path) >= 0 || path.indexOf("/cliente/") === 0) {
          initialBackground = "#f5f7fb";
        } else if (authPaths.indexOf(path) >= 0) {
          initialBackground = "#06111d";
        } else {
          try {
            var lastBackground = window.localStorage.getItem("sigapro.last-page-background.v1");
            var rawTheme = window.localStorage.getItem("sigapro-layout-theme");
            var rawEffectiveTheme = window.localStorage.getItem("sigapro.effective-theme.v1");
            var theme = rawTheme ? JSON.parse(rawTheme) : null;
            var effectiveTheme = rawEffectiveTheme ? JSON.parse(rawEffectiveTheme) : null;

            if (lastBackground && lastBackground.trim()) {
              initialBackground = lastBackground.trim();
            } else if (theme && typeof theme.background === "string" && theme.background.trim()) {
              initialBackground = theme.background.trim();
            } else if (
              effectiveTheme &&
              typeof effectiveTheme.background === "string" &&
              effectiveTheme.background.trim()
            ) {
              initialBackground = effectiveTheme.background.trim();
            }
          } catch (error) {
            initialBackground = "#f5f7fb";
          }
        }

        document.documentElement.style.setProperty("--sig-initial-bg", initialBackground);

        var initialAppZoom =
          publicPaths.indexOf(path) >= 0 || isFullDocumentRoute ? "1" : "0.85";

        document.documentElement.style.zoom = initialAppZoom;
        document.documentElement.setAttribute(
          "data-page-zoom",
          initialAppZoom === "1" ? "100" : "85"
        );
        document.documentElement.setAttribute("data-sigapro-initial-render", "true");
      })();
    </script>
