<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIGAPRO | Plataforma institucional para protocolo e aprovacao de projetos</title>

      content="SIGAPRO | Plataforma institucional para protocolo digital, analise tecnica, tramitacao e aprovacao de projetos urbanos."
    />
    <meta name="author" content="SIGAPRO" />
    <meta name="application-name" content="SIGAPRO" />
    <meta name="theme-color" content="#0b1d30" />
    <meta name="apple-mobile-web-app-title" content="SIGAPRO" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="%BASE_URL%favicon-sigapro-v7.svg?v=7" />
    <link rel="icon" type="image/png" sizes="48x48" href="%BASE_URL%favicon-48-v7.png?v=7" />
    <link rel="shortcut icon" href="%BASE_URL%favicon-sigapro-v7.svg?v=7" />
    <link rel="apple-touch-icon" sizes="256x256" href="%BASE_URL%favicon.png?v=3" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest?v=7" />
    <link rel="preload" as="image" href="%BASE_URL%sigapro-logo.png" fetchpriority="high" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="SIGAPRO | Plataforma institucional para protocolo e aprovacao de projetos" />
    <meta
      property="og:description"
      content="SIGAPRO | Plataforma institucional para protocolo digital, analise tecnica, tramitacao e aprovacao de projetos urbanos."
    />
    <meta property="og:image" content="%BASE_URL%favicon.png?v=3" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SIGAPRO | Plataforma institucional para protocolo e aprovacao de projetos" />
    <meta
      name="twitter:description"
      content="SIGAPRO | Plataforma institucional para protocolo digital, analise tecnica, tramitacao e aprovacao de projetos urbanos."
    />
    <meta name="twitter:image" content="%BASE_URL%favicon.png?v=3" />
    <script>
      (function () {
        var path = window.location.pathname || "/";
        var publicPaths = ["/", "/inicio", "/apresentacao", "/planos-publicos"];
        var authPaths = ["/acesso", "/criar-conta", "/recuperar-senha"];
        var initialBackground = "#ffffff";

        var isInternalPath =
          publicPaths.indexOf(path) < 0 &&
          authPaths.indexOf(path) < 0 &&
          path.indexOf("/cliente/") !== 0;

        if (publicPaths.indexOf(path) >= 0 || path.indexOf("/cliente/") === 0) {
          initialBackground = "#f5f7fb";
        } else if (authPaths.indexOf(path) >= 0) {
          initialBackground = "#06111d";
        } else {
          try {
            var rawTheme = window.localStorage.getItem("sigapro-layout-theme");
            var theme = rawTheme ? JSON.parse(rawTheme) : null;
            if (theme && typeof theme.background === "string" && theme.background.trim()) {
              initialBackground = theme.background.trim();
            }
          } catch (error) {
            initialBackground = "#ffffff";
          }
        }

        document.documentElement.style.setProperty("--sig-initial-bg", initialBackground);

        // Mantem o mesmo zoom do App antes do primeiro frame e do snapshot.
        // Isso evita pintar em 100% e trocar para 85% depois durante o F5.
        var isFullDocumentRoute =
          /\/processos\/[^/]+\/documentos\/[^/]+\/(visualizar|analisar)$/.test(path);
        var initialZoom =
          publicPaths.indexOf(path) >= 0 || isFullDocumentRoute ? "1" : "0.85";
        document.documentElement.style.zoom = initialZoom;
        document.documentElement.setAttribute(
          "data-page-zoom",
          initialZoom === "1" ? "100" : "85"
        );

        document.documentElement.setAttribute("data-sigapro-booting", "true");
        if (isInternalPath) {
          document.documentElement.setAttribute("data-sigapro-internal", "true");
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: var(--sig-initial-bg, #ffffff);
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      #sigapro-refresh-snapshot {
        display: none;
      }

      html[data-sigapro-internal="true"] #sigapro-refresh-snapshot[data-visible="true"] {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        overflow: hidden;
        background: var(--sig-initial-bg, #ffffff);
        pointer-events: none;
      }

      html[data-sigapro-internal="true"] #sigapro-refresh-snapshot[data-visible="true"] > .sigapro-snapshot-viewport {
        position: absolute;
        left: 0;
        top: var(--sig-snapshot-top, 0px);
        width: var(--sig-snapshot-viewport-width, 100vw);
        min-width: var(--sig-snapshot-viewport-width, 100vw);
        min-height: var(--sig-snapshot-viewport-height, 100vh);
        transform: none !important;
        contain: layout paint style;
      }

      /* O conteúdo acompanha o scroll salvo, mas o chrome fixo permanece preso ao viewport. */
      html[data-sigapro-internal="true"] #sigapro-refresh-snapshot[data-visible="true"] .sig-premium-topbar {
        top: var(--sig-snapshot-scroll-y, 0px) !important;
        transform: none !important;
        opacity: 1 !important;
        visibility: visible !important;
      }

      html[data-sigapro-internal="true"] #sigapro-refresh-snapshot[data-visible="true"] *,
      html[data-sigapro-internal="true"] #sigapro-refresh-snapshot[data-visible="true"] *::before,
      html[data-sigapro-internal="true"] #sigapro-refresh-snapshot[data-visible="true"] *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
        caret-color: transparent !important;
      }

      html[data-sigapro-internal="true"] #sigapro-refresh-snapshot[data-visible="true"] ~ #root {
        visibility: hidden !important;
      }
    </style>
  </head>

  <body>
    <div id="sigapro-refresh-snapshot" aria-hidden="true"></div>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var publicPaths = ["/", "/inicio", "/apresentacao", "/planos-publicos"];
          var authPaths = ["/acesso", "/criar-conta", "/recuperar-senha"];
          var pathname = window.location.pathname;
          var internal =
            publicPaths.indexOf(pathname) === -1 &&
            authPaths.indexOf(pathname) === -1 &&
            pathname.indexOf("/cliente/") !== 0;
          if (!internal) return;

          var raw = window.sessionStorage.getItem("sigapro.visual.snapshot.v2");
          if (!raw) return;
          var snapshot = JSON.parse(raw);
          var locationKey = window.location.pathname + window.location.search + window.location.hash;
          var valid =
            snapshot &&
            snapshot.host === window.location.host &&
            snapshot.path === locationKey &&
            typeof snapshot.html === "string" &&
            snapshot.html.length > 500 &&
            snapshot.pageZoom === (document.documentElement.style.zoom || "1") &&
            typeof snapshot.savedAt === "number" &&
            Date.now() - snapshot.savedAt < 120000;
          if (!valid) return;

          if (typeof snapshot.cssText === "string" && snapshot.cssText.length > 0) {
            var cachedStyle = document.createElement("style");
            cachedStyle.id = "sigapro-refresh-snapshot-css";
            cachedStyle.textContent = snapshot.cssText;
            document.head.appendChild(cachedStyle);
          }

          var host = document.getElementById("sigapro-refresh-snapshot");
          if (!host) return;
          var scrollY = Math.max(0, Number(snapshot.scrollY) || 0);
          host.innerHTML = '<div class="sigapro-snapshot-viewport">' + snapshot.html + "</div>";
          host.style.setProperty("--sig-snapshot-top", String(-scrollY) + "px");
          host.style.setProperty("--sig-snapshot-scroll-y", String(scrollY) + "px");
          host.style.setProperty(
            "--sig-snapshot-viewport-width",
            String(snapshot.viewportWidth || document.documentElement.clientWidth || window.innerWidth) + "px"
          );
          host.style.setProperty(
            "--sig-snapshot-viewport-height",
            String(snapshot.viewportHeight || window.innerHeight) + "px"
          );
          host.setAttribute("data-visible", "true");
          host.setAttribute("data-restored-early", "true");
        } catch (error) {
          // O refresh deve continuar mesmo se o snapshot local estiver inválido.
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
