    <script>
      (function () {
        var path = window.location.pathname || "/";
        var publicPaths = ["/", "/inicio", "/apresentacao", "/planos-publicos"];
        var authPaths = ["/acesso", "/criar-conta", "/recuperar-senha"];
        var initialBackground = "#f5f7fb";

        if (publicPaths.indexOf(path) >= 0 || path.indexOf("/cliente/") === 0) {
          initialBackground = "#f5f7fb";
        } else if (authPaths.indexOf(path) >= 0) {
          initialBackground = "#06111d";
        } else {
          try {
            var lastBackground = window.localStorage.getItem("sigapro.last-page-background.v1");
            var rawTheme = window.localStorage.getItem("sigapro-layout-theme");
            var theme = rawTheme ? JSON.parse(rawTheme) : null;

            if (lastBackground && lastBackground.trim()) {
              initialBackground = lastBackground.trim();
            } else if (theme && typeof theme.background === "string" && theme.background.trim()) {
              initialBackground = theme.background.trim();
            }
          } catch (error) {
            initialBackground = "#f5f7fb";
          }
        }

        document.documentElement.style.setProperty("--sig-initial-bg", initialBackground);

        var isFullDocumentRoute =
          /\/processos\/[^/]+\/documentos\/[^/]+\/(visualizar|analisar)$/.test(path);
        var initialAppZoom =
          publicPaths.indexOf(path) >= 0 || isFullDocumentRoute ? "1" : "0.85";

        document.documentElement.style.zoom = initialAppZoom;
        document.documentElement.setAttribute(
          "data-page-zoom",
          initialAppZoom === "1" ? "100" : "85"
        );
      })();
    </script>

    <style>
      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: var(--sig-initial-bg, #f5f7fb);
      }

      html,
      body {
        min-height: 100vh;
        min-height: 100dvh;
      }

      body {
        overflow-x: hidden;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      #root[data-sigapro-continuity="true"] {
        pointer-events: none;
        user-select: none;
      }

      #root[data-sigapro-continuity="true"] *,
      #root[data-sigapro-continuity="true"] *::before,
      #root[data-sigapro-continuity="true"] *::after {
        animation: none !important;
        transition: none !important;
        caret-color: transparent !important;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script>
      (function () {
        var continuityKey = "sigapro.refresh.continuity.v1";
        try {
          var raw = window.sessionStorage.getItem(continuityKey);
          if (!raw) return;

          var snapshot = JSON.parse(raw);
          var sessionRaw = window.localStorage.getItem("sigapro.platform.session.v1");
          var currentSession = sessionRaw ? JSON.parse(sessionRaw) : null;
          var currentUserId =
            currentSession &&
            currentSession.id &&
            currentSession.accountStatus !== "blocked" &&
            currentSession.accountStatus !== "inactive"
              ? String(currentSession.id)
              : "";
          var locationKey =
            window.location.pathname + window.location.search + window.location.hash;

          var valid =
            snapshot &&
            snapshot.host === window.location.host &&
            snapshot.location === locationKey &&
            snapshot.userId === currentUserId &&
            currentUserId.length > 0 &&
            typeof snapshot.html === "string" &&
            snapshot.html.length > 500 &&
            typeof snapshot.savedAt === "number" &&
            Date.now() - snapshot.savedAt < 1000 * 60 * 5;

          if (!valid) {
            window.sessionStorage.removeItem(continuityKey);
            return;
          }

          var root = document.getElementById("root");
          if (!root) return;

          root.innerHTML = snapshot.html;
          root.setAttribute("data-sigapro-continuity", "true");
        } catch (error) {
          try {
            window.sessionStorage.removeItem(continuityKey);
          } catch (_) {}
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
