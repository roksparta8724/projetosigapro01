    <script>
      (function () {
        var path = window.location.pathname || "/";
        var publicPaths = ["/", "/inicio", "/apresentacao", "/planos-publicos"];
        var authPaths = ["/acesso", "/criar-conta", "/recuperar-senha"];
        var initialBackground = "#f3faf7";

        var isInternalPath =
          publicPaths.indexOf(path) < 0 &&
          authPaths.indexOf(path) < 0 &&
          path.indexOf("/cliente/") !== 0;

        if (publicPaths.indexOf(path) >= 0 || path.indexOf("/cliente/") === 0) {
          initialBackground = "#f5f7fb";
        } else if (authPaths.indexOf(path) >= 0) {
          initialBackground = "#06111d";
        } else {
          try {
            var rawTheme = window.localStorage.getItem("sigapro-layout-theme");
            var theme = rawTheme ? JSON.parse(rawTheme) : null;
            if (theme && typeof theme.background === "string" && theme.background.trim()) {
              initialBackground = theme.background.trim();
            }
          } catch (error) {
            initialBackground = "#f3faf7";
          }
        }

        document.documentElement.style.setProperty("--sig-initial-bg", initialBackground);
        document.documentElement.setAttribute("data-sigapro-booting", "true");
        if (isInternalPath) {
          document.documentElement.setAttribute("data-sigapro-internal", "true");
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: var(--sig-initial-bg, #f3faf7);
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      #sigapro-boot-shell {
        display: none;
      }

      html[data-sigapro-internal="true"][data-sigapro-booting="true"] #sigapro-boot-shell {
        display: grid;
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        grid-template-columns: 138px 1fr;
        grid-template-rows: 68px 1fr;
        background: #f3faf7;
        pointer-events: none;
      }

      .sig-boot-topbar {
        grid-column: 1 / -1;
        background: #1f4f70;
        border-bottom: 1px solid rgba(255,255,255,.12);
        display: flex;
        align-items: center;
        padding: 0 20px;
        gap: 12px;
      }

      .sig-boot-logo {
        width: 84px;
        height: 28px;
        border-radius: 8px;
        background: rgba(255,255,255,.94);
      }

      .sig-boot-topbar-fill {
        margin-left: auto;
        width: 245px;
        height: 38px;
        border-radius: 14px;
        background: rgba(255,255,255,.12);
      }

      .sig-boot-sidebar {
        background: #123f62;
        padding: 18px 12px;
      }

      .sig-boot-side-line {
        height: 44px;
        border-radius: 14px;
        margin-bottom: 10px;
        background: rgba(255,255,255,.09);
      }

      .sig-boot-side-line.active {
        background: rgba(96,165,250,.34);
      }

      .sig-boot-main {
        padding: 22px;
        overflow: hidden;
      }

      .sig-boot-banner {
        height: 116px;
        border-radius: 22px;
        background: #164667;
        margin-bottom: 18px;
      }

      .sig-boot-card {
        height: 86px;
        border-radius: 18px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        box-shadow: 0 10px 28px rgba(15,23,42,.05);
        margin-bottom: 16px;
      }

      .sig-boot-card.large {
        height: 220px;
      }

      @media (max-width: 767px) {
        html[data-sigapro-internal="true"][data-sigapro-booting="true"] #sigapro-boot-shell {
          grid-template-columns: 1fr;
          grid-template-rows: 60px 1fr;
        }
        .sig-boot-sidebar { display: none; }
        .sig-boot-main { padding: 14px; }
      }
    </style>
  </head>

  <body>
    <div id="sigapro-boot-shell" aria-hidden="true">
      <div class="sig-boot-topbar">
        <div class="sig-boot-logo"></div>
        <div class="sig-boot-topbar-fill"></div>
      </div>
      <aside class="sig-boot-sidebar">
        <div class="sig-boot-side-line"></div>
        <div class="sig-boot-side-line active"></div>
        <div class="sig-boot-side-line"></div>
        <div class="sig-boot-side-line"></div>
        <div class="sig-boot-side-line"></div>
        <div class="sig-boot-side-line"></div>
      </aside>
      <main class="sig-boot-main">
        <div class="sig-boot-banner"></div>
        <div class="sig-boot-card"></div>
        <div class="sig-boot-card large"></div>
      </main>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
