    <script>
      (function () {
        var path = window.location.pathname || "/";
        var publicPaths = ["/", "/inicio", "/apresentacao", "/planos-publicos"];
        var authPaths = ["/acesso", "/criar-conta", "/recuperar-senha"];
        var isFullDocumentRoute =
          /\/processos\/[^/]+\/documentos\/[^/]+\/(visualizar|analisar)$/.test(path);
        var initialBackground = isFullDocumentRoute ? "#2b3037" : "#e8f0f7";

        if (isFullDocumentRoute) {
          initialBackground = "#2b3037";
        } else if (publicPaths.indexOf(path) >= 0 || path.indexOf("/cliente/") === 0) {
          initialBackground = "#f5f7fb";
        } else if (authPaths.indexOf(path) >= 0) {
          initialBackground = "#06111d";
        } else {
          try {
            var lastBackground = window.localStorage.getItem("sigapro.last-page-background.v2");
            var rawTheme = window.localStorage.getItem("sigapro-layout-theme.v2");
            var rawEffectiveTheme = window.localStorage.getItem("sigapro.effective-theme.v2");
            var theme = rawTheme ? JSON.parse(rawTheme) : null;
            var effectiveTheme = rawEffectiveTheme ? JSON.parse(rawEffectiveTheme) : null;

            if (lastBackground && lastBackground.trim()) {
              initialBackground = lastBackground.trim();
            } else if (theme && typeof theme.background === "string" && theme.background.trim()) {
              initialBackground = theme.background.trim();
            } else if (
              effectiveTheme &&
              typeof effectiveTheme.background === "string" &&
              effectiveTheme.background.trim()
            ) {
              initialBackground = effectiveTheme.background.trim();
            }
          } catch (error) {
            initialBackground = "#e8f0f7";
          }
        }

        // O CSS de base define --sig-bg como branco. Alinhar as duas variáveis
        // antes do carregamento do CSS evita uma tela toda branca ao atualizar.
        document.documentElement.style.setProperty("--sig-initial-bg", initialBackground);
        document.documentElement.style.setProperty("--sig-bg", initialBackground);

        // Em uma rota interna já autenticada, preserve também a faixa visual do
        // topbar enquanto o bundle React executa. Isto não é um loading/shell:
        // é apenas o fundo do documento vazio, evitando um flash totalmente
        // branco entre F5 e o primeiro commit real da aplicação.
        try {
          var cachedSessionRaw = window.localStorage.getItem("sigapro.platform.session.v1");
          var cachedSession = cachedSessionRaw ? JSON.parse(cachedSessionRaw) : null;
          var isInternalRoute =
            publicPaths.indexOf(path) < 0 &&
            authPaths.indexOf(path) < 0 &&
            path.indexOf("/cliente/") !== 0;
          if (
            isInternalRoute &&
            cachedSession &&
            cachedSession.id &&
            cachedSession.id !== "unknown" &&
            cachedSession.accountStatus !== "blocked" &&
            cachedSession.accountStatus !== "inactive"
          ) {
            var rawEffectiveThemeForBoot = window.localStorage.getItem("sigapro.effective-theme.v2");
            var effectiveThemeForBoot = rawEffectiveThemeForBoot
              ? JSON.parse(rawEffectiveThemeForBoot)
              : null;
            var initialTopbar =
              effectiveThemeForBoot &&
              typeof effectiveThemeForBoot.primary === "string" &&
              effectiveThemeForBoot.primary.trim()
                ? effectiveThemeForBoot.primary.trim()
                : "#0b3147";
            document.documentElement.style.setProperty("--sig-initial-topbar", initialTopbar);
            document.documentElement.setAttribute("data-sigapro-cached-internal", "true");
          }
        } catch (error) {
          // Continuidade visual é opcional; nunca bloquear a aplicação.
        }

        // Mesma escala desde o primeiro frame.
        var hostName = window.location.hostname.toLowerCase();
        var rootDomain = "sigapromunicipal.com.br";
        var forcedTenant = new URLSearchParams(window.location.search).get("tenant") ||
          new URLSearchParams(window.location.search).get("subdomain") || "";
        var subdomain = forcedTenant.toLowerCase() ||
          (hostName.endsWith(".localhost") ? hostName.slice(0, -".localhost".length) : "") ||
          (hostName.endsWith("." + rootDomain) ? hostName.slice(0, -(rootDomain.length + 1)) : "");
        var reservedSubdomain = ["www", "app", "admin", "api", "support", "docs", "mail", "root", "status", "auth"];
        var isTenantHost = !!subdomain && reservedSubdomain.indexOf(subdomain) === -1;
        // Uma escala para todos os dominios e rotas.
        var initialAppZoom = "1";

        document.documentElement.style.zoom = initialAppZoom;
        document.documentElement.setAttribute("data-page-zoom", "100");
        document.documentElement.setAttribute("data-sigapro-document-route", isFullDocumentRoute ? "true" : "false");
        document.documentElement.setAttribute("data-sigapro-initial-render", "true");
        // A hard refresh must NEVER display a replacement full-screen page.
        // Only a true prolonged boot failure may expose a small recovery notice.
        window.setTimeout(function () {
          if (document.documentElement.getAttribute("data-sigapro-initial-render") === "true") {
            document.documentElement.setAttribute("data-sigapro-boot-slow", "true");
          }
        }, 15000);

        // Atualiza o Service Worker mesmo quando o bundle da aplicação não inicia.
        // Nunca apaga sessões, rascunhos ou dados e não força reload no usuário.
        if ("serviceWorker" in navigator) {
          window.addEventListener("load", function () {
            navigator.serviceWorker.getRegistration()
              .then(function (registration) {
                if (registration) return registration.update();
              })
              .catch(function () {});
          }, { once: true });
        }

        window.setTimeout(function () {
          if (!document.documentElement.hasAttribute("data-sigapro-initial-render")) return;
          var status = document.getElementById("sigapro-preboot-message");
          if (status) status.textContent =
            "O carregamento não foi concluído. Acesse novamente pelo botão abaixo ou atualize a página. O SIGAPRO não altera seus registros durante esta verificação.";
        }, 10000);
      })();
    </script>

    <style>
      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: var(--sig-initial-bg, #f5f7fb);
      }

      /* Sem fundo artificial. A rota autenticada conserva apenas sua cor de
         tema real até a montagem do React. Nenhum canvas azul ocupa a página. */

      html,
      body {
        min-height: 100vh;
        min-height: 100dvh;
      }

      body {
        overflow-x: hidden;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      /* Status estático de recuperação: permanece se o bundle falhar antes do React. */
      #sigapro-preboot-recovery {
        position: fixed;
        inset: auto 16px 16px auto;
        z-index: 99999;
        display: none;
        width: min(350px, calc(100vw - 32px));
        max-width: 100%;
        padding: 0;
        background: transparent;
        color: #0f172a;
        font-family: Inter, system-ui, sans-serif;
        pointer-events: auto;
      }
      html[data-sigapro-initial-render="true"][data-sigapro-boot-slow="true"] #sigapro-preboot-recovery {
        display: flex;
      }
      #sigapro-preboot-recovery > section {
        width: 100%;
        padding: 14px 16px;
        border-radius: 14px;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        box-shadow: 0 10px 28px rgba(2, 14, 28, 0.22);
      }
      html[data-sigapro-document-route="true"] #sigapro-preboot-recovery {
        background: #2b3037;
        color: #f8fafc;
      }
      html[data-sigapro-document-route="true"] #sigapro-preboot-recovery > section {
        background: #102637;
        border-color: #475569;
      }
      html[data-sigapro-document-route="true"] #sigapro-preboot-recovery h1 {
        color: #ffffff;
      }
      html[data-sigapro-document-route="true"] #sigapro-preboot-recovery p {
        color: #cbd5e1;
      }
      html[data-sigapro-document-route="true"] #sigapro-preboot-recovery strong {
        color: #bae6fd !important;
      }
      #sigapro-preboot-recovery h1 {
        margin: 10px 0 0;
        font-size: 15px;
        line-height: 1.3;
        color: #0f172a;
      }
      #sigapro-preboot-recovery p {
        margin: 12px 0 0;
        color: #475569;
        font-size: 12px;
        line-height: 1.5;
      }
      #sigapro-preboot-recovery a {
        display: inline-block;
        margin-top: 12px;
        padding: 9px 13px;
        border-radius: 9px;
        background: #075985;
        color: white;
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
      }
      html[data-sigapro-initial-render="true"] *,
      html[data-sigapro-initial-render="true"] *::before,
      html[data-sigapro-initial-render="true"] *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    </style>

    <!-- Determinar a cor real da página antes da folha global, sem fundo de substituição. -->
    <link rel="stylesheet" href="/src/index.css" />

    <script type="module" src="/src/main.tsx" fetchpriority="high"></script>
  </head>

  <body>
    <div id="root"></div>
    <div id="sigapro-preboot-recovery" role="status" aria-live="polite">
      <section>
        <strong style="color:#075985;font-size:12px;letter-spacing:.1em;text-transform:uppercase">SIGAPRO · Recuperação de conexão</strong>
        <h1>Falha prolongada de conexão</h1>
        <p id="sigapro-preboot-message">Não foi possível iniciar a interface. Seus processos e documentos não são modificados por esta tentativa.</p>
        <a href="/acesso">Ir para o acesso</a>
      </section>
    </div>
    <noscript>
      <p style="padding:24px;background:#fff;color:#0f172a">O SIGAPRO precisa de JavaScript habilitado para abrir a plataforma.</p>
    </noscript>
  </body>
</html>
