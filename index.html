<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="application-name" content="SIGAPRO" />
    <meta name="theme-color" content="#0b1d30" />
    <meta name="apple-mobile-web-app-title" content="SIGAPRO" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="%BASE_URL%favicon-sigapro-v7.svg?v=7" />
    <link rel="icon" type="image/png" sizes="48x48" href="%BASE_URL%favicon-48-v7.png?v=7" />
    <link rel="shortcut icon" href="%BASE_URL%favicon-sigapro-v7.svg?v=7" />
    <link rel="apple-touch-icon" sizes="256x256" href="%BASE_URL%favicon.png?v=3" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest?v=7" />
    <link rel="stylesheet" href="/src/index.css" />
    <link rel="stylesheet" href="/src/components/platform/ProcessIdentityPanel.css" />
    <link rel="stylesheet" href="/src/components/platform/AnalysisReadinessPanel.css" />
    <link rel="preload" as="image" href="%BASE_URL%sigapro-logo.png" fetchpriority="high" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="SIGAPRO | Plataforma institucional para protocolo e aprovacao de projetos" />
    <meta
      property="og:description"
      content="SIGAPRO | Plataforma institucional para protocolo digital, analise tecnica, tramitacao e aprovacao de projetos urbanos."
    />
    <meta property="og:image" content="%BASE_URL%favicon.png?v=3" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SIGAPRO | Plataforma institucional para protocolo e aprovacao de projetos" />
    <meta
      name="twitter:description"
      content="SIGAPRO | Plataforma institucional para protocolo digital, analise tecnica, tramitacao e aprovacao de projetos urbanos."
    />
    <meta name="twitter:image" content="%BASE_URL%favicon.png?v=3" />



    <script>
      (function () {
        var path = window.location.pathname || "/";
        var publicPaths = ["/", "/inicio", "/apresentacao", "/planos-publicos"];
        var authPaths = ["/acesso", "/criar-conta", "/recuperar-senha"];
        var isFullDocumentRoute =
          /\/processos\/[^/]+\/documentos\/[^/]+\/(visualizar|analisar)$/.test(path);
        var initialBackground = isFullDocumentRoute ? "#2b3037" : "#f5f7fb";

        if (isFullDocumentRoute) {
          initialBackground = "#2b3037";
        } else if (publicPaths.indexOf(path) >= 0 || path.indexOf("/cliente/") === 0) {
          initialBackground = "#f5f7fb";
        } else if (authPaths.indexOf(path) >= 0) {
          initialBackground = "#06111d";
        } else {
          try {
            var lastBackground = window.localStorage.getItem("sigapro.last-page-background.v2");
            var rawTheme = window.localStorage.getItem("sigapro-layout-theme.v2");
            var rawEffectiveTheme = window.localStorage.getItem("sigapro.effective-theme.v2");
            var theme = rawTheme ? JSON.parse(rawTheme) : null;
            var effectiveTheme = rawEffectiveTheme ? JSON.parse(rawEffectiveTheme) : null;

            if (lastBackground && lastBackground.trim()) {
              initialBackground = lastBackground.trim();
            } else if (theme && typeof theme.background === "string" && theme.background.trim()) {
              initialBackground = theme.background.trim();
            } else if (
              effectiveTheme &&
              typeof effectiveTheme.background === "string" &&
              effectiveTheme.background.trim()
            ) {
              initialBackground = effectiveTheme.background.trim();
            }
          } catch (error) {
            initialBackground = "#f5f7fb";
          }
        }

        document.documentElement.style.setProperty("--sig-initial-bg", initialBackground);

        // Em uma rota interna já autenticada, preserve também a faixa visual do
        // topbar enquanto o bundle React executa. Isto não é um loading/shell:
        // é apenas o fundo do documento vazio, evitando um flash totalmente
        // branco entre F5 e o primeiro commit real da aplicação.
        try {
          var cachedSessionRaw = window.localStorage.getItem("sigapro.platform.session.v1");
          var cachedSession = cachedSessionRaw ? JSON.parse(cachedSessionRaw) : null;
          var isInternalRoute =
            publicPaths.indexOf(path) < 0 &&
            authPaths.indexOf(path) < 0 &&
            path.indexOf("/cliente/") !== 0;
          if (
            isInternalRoute &&
            cachedSession &&
            cachedSession.id &&
            cachedSession.id !== "unknown" &&
            cachedSession.accountStatus !== "blocked" &&
            cachedSession.accountStatus !== "inactive"
          ) {
            var rawEffectiveThemeForBoot = window.localStorage.getItem("sigapro.effective-theme.v2");
            var effectiveThemeForBoot = rawEffectiveThemeForBoot
              ? JSON.parse(rawEffectiveThemeForBoot)
              : null;
            var initialTopbar =
              effectiveThemeForBoot &&
              typeof effectiveThemeForBoot.primary === "string" &&
              effectiveThemeForBoot.primary.trim()
                ? effectiveThemeForBoot.primary.trim()
                : "#0b3147";
            document.documentElement.style.setProperty("--sig-initial-topbar", initialTopbar);
            document.documentElement.setAttribute("data-sigapro-cached-internal", "true");
          }
        } catch (error) {
          // Continuidade visual é opcional; nunca bloquear a aplicação.
        }

        // Mesma escala desde o primeiro frame.
        var hostName = window.location.hostname.toLowerCase();
        var rootDomain = "sigapromunicipal.com.br";
        var forcedTenant = new URLSearchParams(window.location.search).get("tenant") ||
          new URLSearchParams(window.location.search).get("subdomain") || "";
        var subdomain = forcedTenant.toLowerCase() ||
          (hostName.endsWith(".localhost") ? hostName.slice(0, -".localhost".length) : "") ||
          (hostName.endsWith("." + rootDomain) ? hostName.slice(0, -(rootDomain.length + 1)) : "");
        var reservedSubdomain = ["www", "app", "admin", "api", "support", "docs", "mail", "root", "status", "auth"];
        var isTenantHost = !!subdomain && reservedSubdomain.indexOf(subdomain) === -1;
        // Uma escala para todos os dominios e rotas.
        var initialAppZoom = "1";

        document.documentElement.style.zoom = initialAppZoom;
        document.documentElement.setAttribute("data-page-zoom", "100");
        document.documentElement.setAttribute("data-sigapro-initial-render", "true");
      })();
    </script>

    <style>
      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: var(--sig-initial-bg, #f5f7fb);
      }

      html,
      body {
        min-height: 100vh;
        min-height: 100dvh;
      }

      body {
        overflow-x: hidden;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      html[data-sigapro-initial-render="true"] *,
      html[data-sigapro-initial-render="true"] *::before,
      html[data-sigapro-initial-render="true"] *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    </style>

    <!--
      O módulo principal é render-blocking de propósito:
      em F5 o novo documento não pode pintar #root vazio. O navegador só libera
      o primeiro paint depois de main.tsx executar e o React concluir o commit inicial.
    -->
    <script
      type="module"
      src="/src/main.tsx"
      blocking="render"
      fetchpriority="high"
    ></script>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
