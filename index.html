    <script>
      (function () {
        var path = window.location.pathname || "/";
        var publicPaths = ["/", "/inicio", "/apresentacao", "/planos-publicos"];
        var authPaths = ["/acesso", "/criar-conta", "/recuperar-senha"];
        var isFullDocumentRoute =
          /\/processos\/[^/]+\/documentos\/[^/]+\/(visualizar|analisar)$/.test(path);
        var initialBackground = isFullDocumentRoute ? "#dfe5ec" : "#f5f7fb";

        if (isFullDocumentRoute) {
          initialBackground = "#dfe5ec";
        } else if (publicPaths.indexOf(path) >= 0 || path.indexOf("/cliente/") === 0) {
          initialBackground = "#f5f7fb";
        } else if (authPaths.indexOf(path) >= 0) {
          initialBackground = "#06111d";
        } else {
          try {
            var lastBackground = window.localStorage.getItem("sigapro.last-page-background.v1");
            var rawTheme = window.localStorage.getItem("sigapro-layout-theme");
            var theme = rawTheme ? JSON.parse(rawTheme) : null;

            if (lastBackground && lastBackground.trim()) {
              initialBackground = lastBackground.trim();
            } else if (theme && typeof theme.background === "string" && theme.background.trim()) {
              initialBackground = theme.background.trim();
            }
          } catch (error) {
            initialBackground = "#f5f7fb";
          }
        }

        document.documentElement.style.setProperty("--sig-initial-bg", initialBackground);

        var initialAppZoom =
          publicPaths.indexOf(path) >= 0 || isFullDocumentRoute ? "1" : "0.85";

        document.documentElement.style.zoom = initialAppZoom;
        document.documentElement.setAttribute(
          "data-page-zoom",
          initialAppZoom === "1" ? "100" : "85"
        );
      })();
    </script>

    <style>
      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: var(--sig-initial-bg, #f5f7fb);
      }

      html,
      body {
        min-height: 100vh;
        min-height: 100dvh;
      }

      body {
        overflow-x: hidden;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      #root[data-sigapro-continuity="true"] {
        pointer-events: none;
        user-select: none;
      }

      #root[data-sigapro-continuity="true"] *,
      #root[data-sigapro-continuity="true"] *::before,
      #root[data-sigapro-continuity="true"] *::after {
        animation: none !important;
        transition: none !important;
        caret-color: transparent !important;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script>
      (function () {
        var continuityKey = "sigapro.refresh.continuity.v1";
        try {
          var raw = window.sessionStorage.getItem(continuityKey);
          if (!raw) return;

          var snapshot = JSON.parse(raw);
          var sessionRaw = window.localStorage.getItem("sigapro.platform.session.v1");
          var currentSession = sessionRaw ? JSON.parse(sessionRaw) : null;
          var currentUserId =
            currentSession &&
            currentSession.id &&
            currentSession.accountStatus !== "blocked" &&
            currentSession.accountStatus !== "inactive"
              ? String(currentSession.id)
              : "";
          var locationKey =
            window.location.pathname + window.location.search + window.location.hash;

          var valid =
            snapshot &&
            snapshot.host === window.location.host &&
            snapshot.location === locationKey &&
            snapshot.userId === currentUserId &&
            currentUserId.length > 0 &&
            typeof snapshot.html === "string" &&
            snapshot.html.length > 500 &&
            typeof snapshot.savedAt === "number" &&
            Date.now() - snapshot.savedAt < 1000 * 60 * 5;

          if (!valid) {
            window.sessionStorage.removeItem(continuityKey);
            return;
          }

          var root = document.getElementById("root");
          if (!root) return;

          root.innerHTML = snapshot.html;
          root.setAttribute("data-sigapro-continuity", "true");
        } catch (error) {
          try {
            window.sessionStorage.removeItem(continuityKey);
          } catch (_) {}
        }
      })();
    </script>
    <script>
      (function () {
        var path = window.location.pathname || "/";
        var isDocumentWorkspace =
          /\/processos\/[^/]+\/documentos\/[^/]+\/(visualizar|analisar)$/.test(path);
        if (!isDocumentWorkspace) return;

        var root = document.getElementById("root");
        if (!root || root.innerHTML.trim()) return;

        root.innerHTML =
          '<main data-sigapro-document-preboot="true" style="height:100vh;width:100vw;overflow:hidden;background:#dfe5ec;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">' +
            '<div style="height:66px;background:linear-gradient(135deg,#071525 0%,#102a43 55%,#123a58 100%);border-bottom:1px solid rgba(255,255,255,.10);display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-sizing:border-box">' +
              '<div style="display:flex;align-items:center;gap:12px">' +
                '<div style="width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.10)"></div>' +
                '<div><div style="width:112px;height:9px;border-radius:999px;background:rgba(255,255,255,.18)"></div><div style="margin-top:8px;width:210px;height:13px;border-radius:999px;background:rgba(255,255,255,.32)"></div></div>' +
              '</div>' +
              '<div style="display:flex;gap:8px"><div style="width:92px;height:34px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06)"></div><div style="width:112px;height:34px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06)"></div></div>' +
            '</div>' +
            '<div style="height:54px;background:#fff;border-bottom:1px solid #dbe3ec;display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-sizing:border-box">' +
              '<div style="display:flex;gap:8px"><div style="width:116px;height:34px;border-radius:999px;background:#f1f5f9"></div><div style="width:38px;height:34px;border-radius:10px;background:#f8fafc"></div><div style="width:38px;height:34px;border-radius:10px;background:#f8fafc"></div></div>' +
              '<div style="display:flex;gap:8px"><div style="width:70px;height:30px;border-radius:999px;background:#f1f5f9"></div><div style="width:38px;height:34px;border-radius:10px;background:#f1f5f9"></div></div>' +
            '</div>' +
            '<div style="height:calc(100vh - 120px);display:grid;grid-template-columns:minmax(0,1fr) 340px">' +
              '<section style="display:flex;align-items:center;justify-content:center;background:#d8dee6;padding:20px;box-sizing:border-box">' +
                '<div style="width:min(760px,86%);height:88%;border-radius:10px;border:1px solid #cbd5e1;background:#fff;box-shadow:0 24px 60px rgba(15,23,42,.16)"></div>' +
              '</section>' +
              '<aside style="border-left:1px solid #dbe3ec;background:#fff;padding:20px;box-sizing:border-box"><div style="width:110px;height:10px;border-radius:999px;background:#e2e8f0"></div><div style="margin-top:18px;height:90px;border-radius:18px;background:#f1f5f9"></div><div style="margin-top:12px;height:140px;border-radius:18px;background:#f1f5f9"></div></aside>' +
            '</div>' +
          '</main>';
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
